name: CI

# Checks that the game builds against the engine release in engine-version.txt, on each platform: its scripts run, and
# aylo-export exports it (which refuses a script that does not compile, or a plugin or backend that does not exist).

on:
  pull_request:
  push:
    branches-ignore: [main] # main is built by build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-22.04 }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Build against the engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build.sh ${{ matrix.platform }}
      - name: The export holds what a player needs
        shell: bash
        run: |
          test -f exports/aylo-example-circle/game.pak
          test -f exports/aylo-example-circle/export.json
          ls dist
